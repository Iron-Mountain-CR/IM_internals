# pyproject.toml for im_internals — company helper toolkit, published on PyPI (2026-09-23) so
# internal scripts can just `pip install --upgrade im-internals` instead of tracking GitHub release
# tags. The source repo itself stays private; only the built package is public.

[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0.0"
# version is now read automatically from the git tag

[project]
name = "im_internals"                      # distribution name (pip install im-internals)
dynamic = ["version"]
description = "Internal helper toolkit for DB, (S)FTP, API, e-mail and other utilities."
readme = "README.md"
requires-python = ">=3.10"

# author / maintainer metadata
authors = [
  { name = "Ivan Bilej", email = "ivan.bilej@ironmountain.com" }
]

# the private company-internal licence file lives at the project root
license = { file = "LICENSE" }

# "Private :: Do Not Upload" removed 2026-09-23 - PyPI rejects any upload carrying that classifier,
# so it has to go for the package to be publishable at all. License stays proprietary (see LICENSE);
# publishing the *package* doesn't change its license terms.
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]

keywords = ["internal", "helpers", "toolkit", "sftp", "database", "api"]

# runtime dependencies (stdlib modules need **not** be listed)
dependencies = [
  "requests>=2",
  "paramiko>=3",
  "pyodbc>=5",
  "tenacity>=8",
  "pypdf>=1",
]

[project.entry-points.console_scripts]
cfg-commands = "cfg_commands:main"

[project.urls]
Source  = "https://github.com/Iron-Mountain-CR/IM_internals"
Tracker = "https://github.com/Iron-Mountain-CR/IM_internals/issues"

# setuptools-specific knobs
[tool.setuptools]
packages = ["im_internals"]
include-package-data = true
